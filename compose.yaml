version: "3.8"

services:
  app:
    build:
      context: . # Path relatif terhadap lokasi file compose.yaml
      dockerfile: Dockerfile
    image: laravel-app
    container_name: laravel-app
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/php.ini
    depends_on:
      - mysql
    environment:
      DB_HOST: mysql
      DB_DATABASE: management
      DB_USERNAME: root
      DB_PASSWORD: oceanli0611
    ports:
      - "9000:9000" # Port PHP-FPM
    networks:
      - backend

  mysql:
    image: mysql:8.0.32
    container_name: mysql
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: oceanli0611
      MYSQL_DATABASE: management
    ports:
      - "3306:3306"
    networks:
      - backend

  nginx:
    image: nginx:latest
    container_name: nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - backend

  adminer:
    image: adminer
    container_name: adminer
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512m
    ports:
      - 8085:8080
    networks:
      - backend

networks:
  backend:
    driver: bridge
