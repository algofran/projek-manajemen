version: "3.8"

services:
  adminer:
    image: adminer
    container_name: adminer
    restart: always
    ports:
      - 8081:8080
    networks:
      - backend

  app:
    build:
      context: ${WORKSPACE}/Aplikasi # Gunakan WORKSPACE untuk direktori fleksibel
      dockerfile: Dockerfile
    image: laravel-app
    container_name: laravel-app
    working_dir: /var/www
    volumes:
      - ${WORKSPACE}/Aplikasi:/var/www # Sesuaikan volume dengan path yang benar
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/php.ini
    depends_on:
      - mysql
    environment:
      DB_HOST: mysql
      DB_DATABASE: management
      DB_USERNAME: root
      DB_PASSWORD: oceanli0611
    ports:
      - "9000:9000" # Port PHP-FPM
    networks:
      - backend

  nginx:
    image: nginx:latest
    container_name: nginx
    restart: always
    ports:
      - "80:80" # Port untuk mengakses aplikasi Laravel
    volumes:
      - ${WORKSPACE}/Aplikasi:/var/www # Sesuaikan volume dengan path yang benar
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - backend

  mysql:
    image: mysql:8.0.32
    container_name: mysql
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: oceanli0611
      MYSQL_DATABASE: management
    ports:
      - "3306:3306" # Port untuk mengakses MySQL (optional)
    networks:
      - backend

networks:
  backend:
    driver: bridge
