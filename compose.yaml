version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel-app
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/php.ini
    command: |
      bash -c "composer install && php artisan key:generate && php-fpm"
    networks:
      - backend
    depends_on:
      - mysql
    environment:
      DB_HOST: mysql
      DB_DATABASE: management
      DB_USERNAME: root
      DB_PASSWORD: oceanli0611
    ports:
      - "9000:9000" # Port PHP-FPM

  mysql:
    image: mysql:8.0.32
    container_name: mysql-container
    environment:
      MYSQL_ROOT_PASSWORD: oceanli0611
      MYSQL_DATABASE: management
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - backend

  nginx:
    image: nginx:latest
    container_name: nginx-container
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - .:/var/www
    ports:
      - "80:80"
    depends_on:
      - app
    networks:
      - backend

  adminer:
    image: adminer
    container_name: adminer-container
    ports:
      - "8081:8080"
    networks:
      - backend

networks:
  laravel_network:
    driver: bridge

volumes:
  mysql-data:
