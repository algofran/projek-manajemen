version: "3.9" # Versi Docker Compose yang sesuai

services:
  # Adminer untuk akses database
  adminer:
    image: adminer
    container_name: adminer
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512m
    ports:
      - "8085:8080" # Port Adminer
    networks:
      - backend

  # Laravel app dengan PHP-FPM
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: laravel-app
    container_name: laravel-app
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/php.ini # Memasukkan konfigurasi PHP
    networks:
      - backend
    depends_on:
      - mysql
    ports:
      - "9000:9000" # Port PHP-FPM untuk Laravel

  # Nginx untuk reverse proxy Laravel
  nginx:
    image: nginx:latest
    container_name: nginx
    restart: always
    ports:
      - "8090:80" # Port HTTP
      - "9443:443" # Port HTTPS
    volumes:
      - .:/var/www # Memasukkan seluruh aplikasi ke Nginx
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf # Konfigurasi Nginx
      - ./docker/nginx/ssl:/etc/nginx/ssl # Sertifikat SSL
    depends_on:
      - app
    networks:
      - backend

  # MySQL untuk database Laravel
  mysql:
    image: mysql:8.0.32
    container_name: mysql
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: admin123 # Password untuk root
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1g
    ports:
      - "3306:3306" # Port MySQL
    networks:
      - backend

  # Jenkins untuk CI/CD
  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    restart: always
    user: root # Agar volume memiliki izin akses
    ports:
      - "8086:8080" # Port Jenkins
      - "50000:50000" # Port agen Jenkins
    volumes:
      - jenkins_home:/var/jenkins_home # Volume untuk Jenkins
    networks:
      - backend

networks:
  backend:
    driver: bridge # Menggunakan jaringan bridge

volumes:
  jenkins_home: # Volume untuk Jenkins
