version: "3.9"
services:
  app:
    build:
      context: .
    container_name: laravel-app
    volumes:
      - .:/var/www
    networks:
      - laravel_network
    depends_on:
      - mysql
    environment:
      - DB_HOST=mysql
      - DB_DATABASE=management
      - DB_USERNAME=root
      - DB_PASSWORD=oceanli0611

  mysql:
    image: mysql:8.0.32
    container_name: mysql-container
    environment:
      MYSQL_ROOT_PASSWORD: oceanli0611
      MYSQL_DATABASE: management
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - laravel_network

  nginx:
    image: nginx:latest
    container_name: nginx-container
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - .:/var/www
    ports:
      - "80:80"
    depends_on:
      - php-fpm
    networks:
      - laravel_network

  php-fpm:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/var/www
    networks:
      - laravel-network

  adminer: # Menambahkan Adminer
    image: adminer
    container_name: adminer-container
    ports:
      - "8080:8080" # Port Adminer yang akan diakses melalui browser
    networks:
      - laravel_network

networks:
  laravel_network:
    driver: bridge

volumes:
  mysql-data:
