server {
    listen 80;
    server_name 212194.websiteku.online;

    # Redirect HTTP ke HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name 212194.websiteku.online;
    root /var/www/public;
    index index.php index.html;

    # Sertifikat SSL
    ssl_certificate /etc/nginx/ssl/fullchain.pem;       # Path ke sertifikat
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;     # Path ke kunci privat

    # Protokol SSL yang aman
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000; # Sesuaikan dengan layanan PHP di Docker Compose
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location ~ /\.ht {
        deny all;
    }
}
