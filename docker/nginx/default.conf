server {
    listen 80;
    server_name dashweb.site;

    # Redirect HTTP ke HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name dashweb.site;

    # Lokasi file SSL
    ssl_certificate /etc/nginx/ssl/certificate.crt;  # Ganti dengan path sertifikat SSL Anda
    ssl_certificate_key /etc/nginx/ssl/private.key;  # Ganti dengan path kunci pribadi SSL Anda

    # Pengaturan SSL lainnya
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES128-GCM-SHA256:!aNULL:!MD5:!3DES';
    ssl_prefer_server_ciphers on;
    
    # Root dan index untuk aplikasi Laravel
    root /var/www/public;  # Arahkan ke folder public Laravel
    index index.php index.html index.htm;

    # Routing aplikasi Laravel
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM untuk Laravel
    location ~ \.php$ {
        fastcgi_pass app:9000;  # Mengarah ke container PHP-FPM Laravel
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/public$fastcgi_script_name;
        include fastcgi_params;
    }

    # Logs
    error_log /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}
