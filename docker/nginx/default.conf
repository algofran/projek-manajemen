server {
    listen 80;
    server_name dashweb.site;  # Ganti dengan domain Anda

    root /var/www/public;  # Path ke direktori aplikasi Laravel
    index index.php index.html index.htm;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;  # Mengarahkan ke PHP-FPM container
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.ht {
        deny all;
    }
}
