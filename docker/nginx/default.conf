# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name dashweb.site www.dashweb.site;

    # Redirect semua HTTP ke HTTPS
    return 301 https://$host$request_uri;
}

# HTTPS Configuration
server {
    listen 443 ssl http2;
    server_name dashweb.site www.dashweb.site;

    # Sertifikat SSL
    ssl_certificate /etc/nginx/ssl/certificate.crt;
    ssl_certificate_key /etc/nginx/ssl/private.key;

    # Konfigurasi SSL tambahan
    ssl_protocols TLSv1.2 TLSv1.3; # Dukungan protokol TLS modern
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # Pengaturan keamanan tambahan
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";

    # Direktori root untuk aplikasi Anda
    root /var/www/public;
    index index.php index.html;

    # Konfigurasi untuk menangani request
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Konfigurasi untuk PHP-FPM (jika menggunakan PHP)
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass app:9000; # Sesuaikan dengan service PHP Anda
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # Konfigurasi tambahan untuk keamanan dan efisiensi
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|otf|eot|ttf|otf|webp)$ {
        expires max;
        log_not_found off;
    }

    location ~ /\.ht {
        deny all;
    }
}
