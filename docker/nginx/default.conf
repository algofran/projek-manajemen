server {
    listen 80;
    server_name dashweb.site;  # Pastikan nama domain Anda sesuai

    root /var/www/public;  # Pastikan ini mengarah ke folder public Laravel
    index index.php index.html index.htm;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;  # Mengarahkan ke PHP-FPM container
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.ht {
        deny all;
    }
}

server {
    listen 443 ssl;
    server_name dashweb.site;  # Pastikan nama domain Anda sesuai

    ssl_certificate /etc/nginx/ssl/fullchain.pem;  # Path sertifikat SSL
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;  # Path private key

    root /var/www/public;
    index index.php index.html index.htm;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;  # Mengarahkan ke PHP-FPM container
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.ht {
        deny all;
    }
}
