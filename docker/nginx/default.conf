server {
    listen 80;
    server_name dashweb.site;

    # Laravel directory harus mengarah ke folder 'public'
    root /var/www/public;

    index index.php index.html index.htm;

    # Arahkan semua permintaan ke Laravel
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Konfigurasi untuk memproses file PHP
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;  # Ensure this is pointing to 'app' service on port 9000
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # Blokir akses ke file tersembunyi
    location ~ /\.ht {
        deny all;
    }
}
