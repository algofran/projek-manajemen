server {
    listen 80;
    server_name dashweb.site;

    root /var/www/public;  # Arahkan ke folder 'public' Laravel

    index index.php index.html index.htm;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
    include fastcgi_params;
    fastcgi_pass php-fpm:9000;  # Pastikan ini sesuai dengan nama container PHP-FPM Anda
    fastcgi_param SCRIPT_FILENAME /var/www$fastcgi_script_name;
    fastcgi_param DOCUMENT_ROOT /var/www;
    }

    location ~ /\.ht {
        deny all;
    }
}
